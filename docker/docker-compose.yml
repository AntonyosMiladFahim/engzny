# Local infrastructure for the WhatsApp SaaS: WAHA (WhatsApp HTTP API) + MongoDB,
# exposed to the internet through a Cloudflare Tunnel (no router port forwarding).
#
# Usage (from the repo root):
#   cp docker/.env.example docker/.env      # then fill in CLOUDFLARE_TUNNEL_TOKEN
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml ps        # shows health status
#   docker compose -f docker/docker-compose.yml down      # data volumes are kept
#
# Compose automatically loads docker/.env (the directory of this file) and
# substitutes every ${VAR} / ${VAR:-default} below.
#
# Traffic flow:
#   Internet -> Cloudflare edge -> cloudflared -> http://waha:3000        (inbound API)
#   waha -> http://host.docker.internal:5000/api/waha/webhook             (outbound webhooks
#                                                                          to the backend
#                                                                          running on the host)

name: engzny-local

services:
  waha:
    image: devlikeapro/waha:latest
    container_name: engzny-waha
    restart: unless-stopped
    ports:
      # Bound to loopback only: the public entry point is the Cloudflare Tunnel,
      # so WAHA is never reachable from the LAN directly.
      - "127.0.0.1:${WAHA_PORT:-3000}:3000"
    environment:
      # Protect the REST API and the dashboard (change these for anything non-local).
      WHATSAPP_API_KEY: ${WAHA_API_KEY:-local-dev-api-key}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-admin}
      # Engine: WEBJS (default, full feature set) or NOWEB (lighter, no Chromium).
      WHATSAPP_DEFAULT_ENGINE: ${WAHA_ENGINE:-WEBJS}
      # Bring every persisted tenant session back up automatically after a restart.
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
      WHATSAPP_START_SESSION: ""
      # Don't dump QR codes into container logs; use the dashboard / API instead.
      WAHA_PRINT_QR: "False"
      WAHA_LOG_FORMAT: ${WAHA_LOG_FORMAT:-PRETTY}
      WAHA_LOG_LEVEL: ${WAHA_LOG_LEVEL:-info}
      TZ: ${TZ:-UTC}

      # --- Global webhook: deliver events to the backend running on the HOST machine ---
      # host.docker.internal is resolved via extra_hosts below, so this works on
      # Docker Desktop (Windows/macOS) and on plain Linux Docker Engine alike.
      WHATSAPP_HOOK_URL: ${WAHA_WEBHOOK_URL:-http://host.docker.internal:5000/api/waha/webhook}
      # Comma-separated event list. Use "*" to receive everything.
      WHATSAPP_HOOK_EVENTS: ${WAHA_WEBHOOK_EVENTS:-message,message.any,message.ack,message.reaction,session.status,state.change,group.join,group.leave}
      # Retry policy for webhook delivery when the backend is down / restarting.
      WHATSAPP_HOOK_RETRIES_ATTEMPTS: ${WAHA_WEBHOOK_RETRIES:-15}
      WHATSAPP_HOOK_RETRIES_DELAY_SECONDS: ${WAHA_WEBHOOK_RETRY_DELAY:-2}
      # Optional: sign webhook payloads (X-Webhook-Hmac header) so the backend can
      # verify they really came from WAHA. Leave empty to disable.
      WHATSAPP_HOOK_HMAC_KEY: ${WAHA_WEBHOOK_HMAC_KEY:-}
    extra_hosts:
      # Maps host.docker.internal to the Docker host's gateway IP on every platform.
      # On Docker Desktop this alias already exists; on Linux this line is what makes
      # the container able to hit the host machine's port 5000.
      - "host.docker.internal:host-gateway"
    volumes:
      # CRITICAL: multi-tenant WhatsApp sessions must survive container restarts/recreates.
      - ./waha-data:/waha/.sessions
      # Downloaded media (images, voice notes, documents) received via WhatsApp.
      - ./waha-media:/app/.media
    healthcheck:
      # WAHA exposes GET /health; the image is Node-based, so use node instead of curl/wget.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - engzny-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: engzny-cloudflared
    restart: unless-stopped
    # The tunnel token comes from docker/.env (CLOUDFLARE_TUNNEL_TOKEN). The ":?" form
    # makes `docker compose up` fail fast with a clear message if it is missing.
    #
    # Route the public hostname to WAHA in the Cloudflare Zero Trust dashboard:
    #   Networks -> Tunnels -> <tunnel> -> Public Hostname -> Service: http://waha:3000
    # (cloudflared resolves "waha" over the shared Docker network, no host ports needed.)
    #
    # --metrics enables the local /ready endpoint used by the health check.
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in docker/.env}
    healthcheck:
      # The image is distroless (no shell/curl); cloudflared ships its own readiness probe
      # which returns 0 only once the tunnel has active connections to the Cloudflare edge.
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      waha:
        condition: service_healthy
    networks:
      - engzny-net

  mongo:
    image: mongo:7
    container_name: engzny-mongo
    restart: unless-stopped
    ports:
      # Loopback only; the tunnel never exposes Mongo.
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-root}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-engzny}
    volumes:
      - ./mongo-data:/data/db
      - ./mongo-config:/data/configdb
    healthcheck:
      test:
        - "CMD-SHELL"
        - "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - engzny-net

networks:
  engzny-net:
    driver: bridge
