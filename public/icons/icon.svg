<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181C23"/>
      <stop offset="1" stop-color="#0B0D10"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DDF77E"/>
      <stop offset="1" stop-color="#B5E02F"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.79  0 0 0 0 0.94  0 0 0 0 0.29  0 0 0 0.55 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- GNOME-style squircle tile -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)"/>
  <rect x="24.5" y="24.5" width="463" height="463" rx="111.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.09"/>
  <!-- top light catch -->
  <path d="M88 26h336" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round"/>
  <!-- waveform -->
  <g fill="url(#bar)" filter="url(#glow)">
    <rect x="128" y="216" width="40" height="80" rx="20"/>
    <rect x="196" y="160" width="40" height="192" rx="20"/>
    <rect x="264" y="112" width="40" height="288" rx="20"/>
    <rect x="332" y="184" width="40" height="144" rx="20"/>
    <rect x="400" y="232" width="24" height="48" rx="12" transform="translate(-24 0)"/>
  </g>
</svg>
